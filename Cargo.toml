[workspace]
members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
geo = { version = "0.33", features = ["serde"] }
rstar = "0.12"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
