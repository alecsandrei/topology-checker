[workspace]
members = ["crates/core", "crates/io", "crates/cli", "crates/server", "crates/python", "crates/rustgis-plugin"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Alex-Andrei Cuvuliuc"]
repository = "https://github.com/alecsandrei/topology-checker"
homepage = "https://alecsandrei.github.io/topology-checker/"

[workspace.dependencies]
topology-checker-core = { path = "crates/core", version = "0.3.0" }
topology-checker-io = { path = "crates/io", version = "0.3.0" }
geo = { version = "0.33", default-features = false, features = ["serde", "multithreading"] }
rstar = "0.12"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ts-rs = "12"

# Size-tuned build of the RustGIS plugin module:
#   cargo build --profile rustgis-plugin --target wasm32-unknown-unknown -p topology-checker-rustgis
[profile.rustgis-plugin]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
