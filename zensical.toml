# Preview: uv run --only-group docs zensical serve
[project]
site_name = "topology-checker"
# Every version's canonical URL is stable, so search engines prefer the release docs.
site_url = "https://alecsandrei.github.io/topology-checker/stable/"
repo_url = "https://github.com/alecsandrei/topology-checker"
edit_uri = "edit/master/docs/"
strict = true
nav = [
  { Home = "README.md" },
  { Install = "install.md" },
  { CLI = "cli.md" },
  { Rules = "rules.md" },
  { "Web app" = "web-app.md" },
  { RustGIS = "rustgis-plugin.md" },
  { QGIS = "qgis-plugin.md" },
  { Python = [
    { Usage = "python-usage.md" },
    { "API reference" = "python-api.md" },
  ] },
  { "Rust API" = "https://docs.rs/topology-checker-core/latest/topology_checker_core/" },
]

# The version selector reads ../versions.json, which the docs workflow writes from the
# python-v* tags. The mike provider name is only the file format.
[project.extra.version]
provider = "mike"
alias = true

[project.theme]
name = "material"
variant = "modern"
features = ["content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}

[project.plugins]
search = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = false
heading_level = 2
show_source = false
show_if_no_docstring = true
separate_signature = true
show_signature_annotations = true
merge_init_into_class = true
filters = ["!^_"]
