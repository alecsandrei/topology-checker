# Preview: uv run --only-group docs mkdocs serve -f python-api/mkdocs.yml
site_name: topology-checker Python API
# Every version's canonical URL is stable, so search engines prefer the release docs.
site_url: https://alecsandrei.github.io/topology-checker/api/python/stable/
repo_url: https://github.com/alecsandrei/topology-checker
theme:
  name: material
  features:
    - content.code.copy
nav:
  - API reference: index.md
  - User guide: https://alecsandrei.github.io/topology-checker/
# Material's version selector reads ../versions.json, which is maintained by hand like
# Polars' version_switcher.json. The mike provider name is only the file format.
extra:
  version:
    provider: mike
    alias: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../python]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: false
            heading_level: 2
            show_source: false
            show_if_no_docstring: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
