[package]
name = "topology-checker-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
gdal = ["topology-checker-io/gdal", "gdal-system"]
gdal-system = ["topology-checker-io/gdal-system", "dep:gdal"]
bundled = ["gdal"]

[dependencies]
topology-checker-core = { workspace = true, features = ["ts"] }
topology-checker-io = { workspace = true, features = ["ts"] }
geo.workspace = true
rstar.workspace = true
serde.workspace = true
serde_json = "1"
ts-rs = { workspace = true, features = ["serde-json-impl", "no-serde-warnings"] }
clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
anyhow = "1"
gdal = { version = "0.19", optional = true }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
geojson = { version = "0.24", features = ["geo-types"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
