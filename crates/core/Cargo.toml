[package]
name = "topology-checker-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Derive TypeScript bindings for rule, error and geometry-kind names.
ts = ["dep:ts-rs"]

[dependencies]
geo.workspace = true
rstar.workspace = true
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
num-rational = "0.4"
num-traits = "0.2"
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.7"
serde_json = "1"

[[bench]]
name = "rules"
harness = false

[[bench]]
name = "patterns"
harness = false

[[bench]]
name = "allocations"
harness = false
