[package]
name = "topology-checker-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["bundled"]
bundled = ["gdal-sys/bundled", "dep:gdal-src"]

[dependencies]
topology-checker-core = { path = "../core" }
geo.workspace = true
serde.workspace = true
serde_json = "1"
anyhow = "1"
gdal = "0.19"
gdal-sys = "0.12"
gdal-src = { version = "0.3", optional = true, features = [
    "driver_gpkg", "driver_shape", "driver_geojson", "driver_flatgeobuf",
    "driver_csv", "driver_openfilegdb", "driver_tab", "driver_vrt", "driver_mem",
] }

[dev-dependencies]
tempfile = "3"
