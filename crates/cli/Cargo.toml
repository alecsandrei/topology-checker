[package]
name = "topology-checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["bundled"]
bundled = ["topology-checker-io/bundled"]

[dependencies]
topology-checker-core = { path = "../core" }
topology-checker-io = { path = "../io", default-features = false }
geo.workspace = true
serde.workspace = true
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
anstream = "0.6"
toml = "0.8"
gdal = "0.19"

[dev-dependencies]
gdal-sys = "0.12"
assert_cmd = "2"
tempfile = "3"
