[package]
name = "topology-checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
gdal = ["topology-checker-io/gdal", "gdal-system"]
gdal-system = ["topology-checker-io/gdal-system", "dep:gdal", "dep:gdal-sys"]
bundled = ["gdal"]

[dependencies]
topology-checker-core = { path = "../core" }
topology-checker-io = { path = "../io", default-features = false }
geo.workspace = true
serde.workspace = true
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
anstream = "0.6"
toml = "0.8"
gdal = { version = "0.19", optional = true }
gdal-sys = { version = "0.12", optional = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
