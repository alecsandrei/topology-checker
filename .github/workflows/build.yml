name: build
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend install
        run: npm ci --prefix web
      - name: Verify bundled example data
        run: node scripts/prepare-examples.mjs --check
      - name: Frontend type check, component tests and build
        run: |
          npm run format:check --prefix web
          npm run typecheck --prefix web
          npm test --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install sqlite3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Install sqlite3 (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install sqlite -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\SQLite\tools" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - name: Smoke test
        shell: bash
        run: ./target/release/topology-checker rules
      - name: Browser dependencies
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: runner.os == 'Linux'
        env:
          TOPOLOGY_WEB_EXECUTABLE: ./target/release/topology-checker-web
        run: npm run test:browser --prefix web
      - name: Package local application
        shell: bash
        run: |
          mkdir -p builds/package/web
          cp -R web/dist/. builds/package/web/
          cp README.md builds/package/README.md
          cp crates/server/examples/DATA-LICENSE.md builds/package/DATA-LICENSE.md
          if [[ -f target/release/topology-checker.exe ]]; then
            cp target/release/topology-checker.exe target/release/topology-checker-web.exe builds/package/
          else
            cp target/release/topology-checker target/release/topology-checker-web builds/package/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: topology-checker-${{ runner.os }}-${{ runner.arch }}
          path: |
            builds/package/
          if-no-files-found: error
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
