name: build
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend install
        run: npm ci --prefix web
      - name: Verify bundled example data
        run: node scripts/prepare-examples.mjs --check
      - name: Frontend type check, component tests and build
        run: |
          npm run format:check --prefix web
          npm run typecheck --prefix web
          npm test --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Check native GIS dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          bash .github/workflows/native-dependencies.sh
      # The RustGIS plugin is a WebAssembly module (built by the rustgis-plugin job); MSVC cannot link it natively.
      - name: Build
        run: cargo build --workspace --release --locked ${{ runner.os == 'Windows' && '--exclude topology-checker-rustgis' || '' }}
      - name: Test
        run: cargo test --workspace --release --locked ${{ runner.os == 'Windows' && '--exclude topology-checker-rustgis' || '' }}
      - name: Generated files are current
        if: runner.os == 'Linux'
        run: |
          changes=$(git status --porcelain -- web/src/generated docs/rules.md)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Run cargo test and commit the generated files."
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - name: Smoke test
        shell: bash
        run: ./target/release/topology-checker rules
      - name: Browser dependencies
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: runner.os == 'Linux'
        env:
          TOPOLOGY_WEB_EXECUTABLE: ./target/release/topology-checker-web
        run: npm run test:browser --prefix web
      - name: Package local application
        shell: bash
        run: |
          # The web binary embeds web/dist, built in an earlier step.
          mkdir -p builds/package
          cp README.md builds/package/README.md
          cp crates/server/examples/DATA-LICENSE.md builds/package/DATA-LICENSE.md
          if [[ -f target/release/topology-checker.exe ]]; then
            cp target/release/topology-checker.exe target/release/topology-checker-web.exe builds/package/
          else
            cp target/release/topology-checker target/release/topology-checker-web builds/package/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: topology-checker-${{ runner.os }}-${{ runner.arch }}
          path: |
            builds/package/
          if-no-files-found: error
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The RustGIS plugin depends on an SDK that needs Rust 1.90.
      - run: cargo check --workspace --exclude topology-checker-rustgis --all-targets --locked
  rustgis-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build and package the plugin
        run: python3 scripts/package_rustgis_plugin.py --out builds/rustgis-plugin
      - name: Smoke test the module through the plugin ABI
        run: node scripts/rustgis_plugin_smoke.mjs target/wasm32-unknown-unknown/rustgis-plugin/topology_checker_rustgis.wasm --scale 50
      - uses: actions/upload-artifact@v4
        with:
          name: topology-checker-rustgis-plugin
          path: builds/rustgis-plugin/*.rgplugin
          if-no-files-found: error
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The build job reports test failures; this job always measures coverage.
      - run: cargo llvm-cov --workspace --locked --ignore-run-fail --exclude topology-checker-web --json --summary-only --output-path coverage.json
      - name: Badge data
        run: |
          jq '.data[0].totals.lines.percent | floor | {
            schemaVersion: 1,
            label: "coverage",
            message: "\(.)%",
            color: (if . >= 90 then "brightgreen" elif . >= 75 then "green" elif . >= 60 then "yellow" else "red" end)
          }' coverage.json > badge.json
          jq -r '"Line coverage: \(.message)"' badge.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: badge.json
          if-no-files-found: error
  coverage-badge:
    # The README coverage badge reads coverage.json from the badges branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          mv badge.json coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm 'Update coverage badge'
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
  gdal-interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend preparation
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y cmake sqlite3 ripgrep
      - uses: Swatinem/rust-cache@v2
        with:
          key: gdal-bundled
      - name: Bundled GDAL interoperability and application regression tests
        run: cargo test -p topology-checker-io -p topology-checker -p topology-checker-web --features gdal --locked
      - name: GDAL feature lint checks
        run: cargo clippy -p topology-checker-io -p topology-checker -p topology-checker-web --all-targets --features gdal --locked -- -D warnings
      - name: Bundled GDAL browser regression tests
        env:
          TOPOLOGY_WEB_EXECUTABLE: ./target/debug/topology-checker-web
        run: |
          cargo build -p topology-checker-web --features gdal --locked
          cd web
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: System GDAL compatibility
        run: |
          sudo apt-get install -y libgdal-dev gdal-bin
          cargo test -p topology-checker-io -p topology-checker -p topology-checker-web --features gdal-system --locked
