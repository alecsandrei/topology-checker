name: GIS benchmarks
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark scope
        type: choice
        options: [headline, full]
        default: headline
permissions:
  contents: read
concurrency:
  group: gis-benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the shared QGIS 4.2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: benchmarks/gis/Dockerfile
          platforms: linux/amd64
          tags: topology-gis-benchmark:ci
          load: true
          cache-from: type=gha,scope=gis-benchmarks
          cache-to: type=gha,mode=max,scope=gis-benchmarks
      - name: Test adapters and comparison gates
        run: |
          docker run --rm --entrypoint bash topology-gis-benchmark:ci -c \
            'uv run --project benchmarks/gis --frozen --no-sync pytest benchmarks/gis/tests -q && uv run --project benchmarks/gis --frozen --no-sync ruff check benchmarks/gis && uv run --project benchmarks/gis --frozen --no-sync pyright --project benchmarks/gis'
      - name: Verify native QGIS gap extraction at the headline size
        run: |
          docker run --rm -e GIS_INTEGRATION=1 topology-gis-benchmark:ci \
            pytest benchmarks/gis/tests/test_integration.py -k gap_wkb -q
      - name: Measure all engines on the same runner
        env:
          GIS_SOURCE_REVISION: ${{ github.sha }}
          GIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
          GIS_SUITE: ${{ inputs.suite || 'headline' }}
        run: |
          set -o pipefail
          mkdir -p builds/gis-ci/results builds/gis-ci/logs
          gis_arguments=()
          if [[ "$GIS_SUITE" == headline ]]; then
            gis_arguments=(--rules point/must-be-inside polygon/must-contain-point point/must-not-overlap line/must-not-have-dangles polygon/must-not-overlap polygon/must-not-have-gaps --sizes 1000)
          fi
          gis_image="$(docker image inspect topology-gis-benchmark:ci --format '{{.Id}}')"
          docker run --rm --cpuset-cpus=0 \
            -e GIS_SOURCE_REVISION -e GIS_RUN_URL -e RUNNER_NAME -e GIS_NATIVE_CI=1 \
            -e GIS_CONTAINER_IMAGE="$gis_image" \
            -v "$PWD/builds/gis-ci:/results" topology-gis-benchmark:ci \
            python -m benchmarks.gis.run "${gis_arguments[@]}" \
              --output /results/results --work /results/work \
            | tee builds/gis-ci/logs/benchmark.log
          test -f builds/gis-ci/results/publishable.json
      - name: Upload measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-results-${{ github.sha }}
          path: builds/gis-ci/results
          retention-days: 30
          if-no-files-found: error
      - name: Make generated diagnostics readable
        if: always()
        run: |
          if [[ -d builds/gis-ci ]]; then
            sudo chown -R "$(id -u):$(id -g)" builds/gis-ci
            sudo chmod -R u+rwX builds/gis-ci
          fi
      - name: Upload diagnostic logs and input fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-benchmarks-${{ github.sha }}
          path: |
            builds/gis-ci/logs
            builds/gis-ci/**/*.log
            builds/gis-ci/**/*.geojson
          retention-days: 30
          if-no-files-found: error
