name: GIS benchmarks
on:
  workflow_dispatch:
  push:
    branches: [gis-benchmarks]
    paths:
      - .github/workflows/gis-benchmarks.yml
      - .dockerignore
      - benchmarks/gis/**
      - '!benchmarks/gis/results/**'
      - benchmarks/qgis/*.py
      - tests/test_gis_benchmark.py
permissions:
  contents: read
concurrency:
  group: gis-benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the shared QGIS 4.2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: benchmarks/gis/Dockerfile
          platforms: linux/amd64
          tags: topology-gis-benchmark:ci
          load: true
          cache-from: type=gha,scope=gis-benchmarks
          cache-to: type=gha,mode=max,scope=gis-benchmarks
      - name: Test adapters and comparison gates
        run: |
          docker run --rm --entrypoint bash topology-gis-benchmark:ci -c \
            'uv run --project benchmarks/gis --frozen --no-sync pytest tests/test_gis_benchmark.py -q && uv run --project benchmarks/gis --frozen --no-sync ruff check benchmarks/gis tests/test_gis_benchmark.py && uv run --project benchmarks/gis --frozen --no-sync pyright --project benchmarks/gis'
      - name: Native engine smoke checks
        env:
          GIS_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p builds/gis-ci/smoke builds/gis-ci/results builds/gis-ci/logs
          docker run --rm --cpuset-cpus=0 \
            -e GIS_SOURCE_REVISION -e GIS_NATIVE_CI=1 \
            -v "$PWD/builds/gis-ci:/results" topology-gis-benchmark:ci \
            python -m benchmarks.gis.run --smoke --output /results/smoke --work /results/work-smoke
      - name: Measure all engines on the same runner
        env:
          GIS_SOURCE_REVISION: ${{ github.sha }}
          GIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          gis_image="$(docker image inspect topology-gis-benchmark:ci --format '{{.Id}}')"
          docker run --rm --cpuset-cpus=0 \
            -e GIS_SOURCE_REVISION -e GIS_RUN_URL -e RUNNER_NAME -e GIS_NATIVE_CI=1 \
            -e GIS_CONTAINER_IMAGE="$gis_image" \
            -v "$PWD/builds/gis-ci:/results" topology-gis-benchmark:ci \
            python -m benchmarks.gis.run --output /results/results --work /results/work
          test -f builds/gis-ci/results/publishable.json
      - name: Upload results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-benchmarks-${{ github.sha }}
          path: builds/gis-ci
          retention-days: 30
          if-no-files-found: warn
