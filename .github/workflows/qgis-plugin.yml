name: QGIS plugin

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['qgis_plugin/**', 'crates/cli/**', 'crates/core/**', 'crates/io/**', 'crates/python/**', 'python/**', 'pyproject.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/qgis-plugin.yml']
  pull_request:
    paths: ['qgis_plugin/**', 'crates/cli/**', 'crates/core/**', 'crates/io/**', 'crates/python/**', 'python/**', 'pyproject.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/qgis-plugin.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run of a pull request that a newer push replaces is stopped. A run on
  # master is not, so that each push there ends with a result and not with a
  # cancellation
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: qgis_plugin

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Lint
        run: uv run --locked --only-group lint ruff check .

      - name: Check formatting
        run: uv run --locked --only-group lint ruff format --check .

  # The scans that plugins.qgis.org blocks an upload on. `detect-secrets scan`
  # ends with 0 whatever it finds, so the hook of the tool is used, which ends
  # with 1
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Bandit
        run: uv run --locked --only-group lint bandit -r topology_rules

      - name: Secrets
        run: git ls-files -z topology_rules | xargs -0 uv run --locked --only-group lint detect-secrets-hook

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The folder of the plugin without caches, with the version of the tag
      # if there is one
      - name: Build the zip
        run: |
          rm -rf build dist
          mkdir build dist
          cp -r topology_rules build/
          find build -name __pycache__ -prune -exec rm -rf {} +
          find build -name '*.pyc' -delete
          version=$(sed -n 's/^version=//p' build/topology_rules/metadata.txt)
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
          esac
          sed -i "s/^version=.*/version=${version}/" build/topology_rules/metadata.txt
          (cd build && zip -r -X "../dist/topology_rules-${version}.zip" topology_rules)
          unzip -l dist/*.zip

      - name: Check the zip
        run: |
          unzip -Z1 dist/*.zip > files.txt
          for need in topology_rules/__init__.py topology_rules/metadata.txt topology_rules/LICENSE topology_rules/assets/icon.svg; do
            grep -qx "$need" files.txt
          done
          ! grep -E '__pycache__|\.pyc$|\.qgis-settings|\.venv' files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: topology-rules-plugin
          path: qgis_plugin/dist/*.zip
          if-no-files-found: error

  cli:
    name: Build the CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p topology-checker

      - uses: actions/upload-artifact@v4
        with:
          name: topology-checker
          path: target/release/topology-checker
          if-no-files-found: error

  # The Python package of this commit, built as python.yml builds it, which
  # the tests in the ltr and stable images also run the checks with
  wheel:
    name: Build the Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: '1.15.0'
          target: x86_64
          args: --release --locked --out dist
          manylinux: '2014'

      - uses: actions/upload-artifact@v4
        with:
          name: topology-checker-wheel
          path: dist/*.whl
          if-no-files-found: error

  # The QGIS images: 3.34 is the oldest that the plugin supports, `ltr` is the
  # long term release (3.44 now, Qt5), and `stable` is the newest release
  # (4.2 now, Qt6). `expected` is the major version that the tag must ship,
  # so that a tag which moves cannot make a run test the wrong QGIS.
  typecheck:
    name: Pyright (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - qgis: 3.34-noble
            expected: '3'
          - qgis: ltr
            expected: ''
          - qgis: stable
            expected: '4'
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check the QGIS version
        if: matrix.expected != ''
        run: |
          python3 -c "from qgis.core import Qgis; print(Qgis.version())"
          python3 -c "import sys; from qgis.core import Qgis; sys.exit(not Qgis.version().startswith('${{ matrix.expected }}.'))"

      - name: Create venv on top of the system QGIS
        run: uv venv --system-site-packages --python /usr/bin/python3

      - name: Install dependencies
        run: uv sync --locked

      - name: Pyright
        run: uv run pyright

  # The 3.34 image tests the plugin without the Python package, as Windows
  # does, and the others with it
  test:
    name: Pytest (QGIS ${{ matrix.qgis }})
    needs: [cli, wheel]
    runs-on: ubuntu-latest
    # A task that never ends should fail the run, not hold it for hours
    timeout-minutes: 30
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - qgis: 3.34-noble
            expected: '3'
            package: false
          - qgis: ltr
            expected: ''
            package: true
          - qgis: stable
            expected: '4'
            package: true
    env:
      UV_LINK_MODE: copy
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v4
        with:
          name: topology-checker
          path: bin

      - name: Check the QGIS version
        if: matrix.expected != ''
        run: |
          python3 -c "from qgis.core import Qgis; print(Qgis.version())"
          python3 -c "import sys; from qgis.core import Qgis; sys.exit(not Qgis.version().startswith('${{ matrix.expected }}.'))"

      - name: Create venv on top of the system QGIS
        run: uv venv --system-site-packages --python /usr/bin/python3

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/download-artifact@v4
        if: matrix.package
        with:
          name: topology-checker-wheel
          path: wheel

      # Into a folder on the path, as the plugin installs it, without
      # dependencies. The plugin must find it, or its tests fail
      - name: Install the Python package
        if: matrix.package
        run: |
          uv pip install --no-deps --target "$GITHUB_WORKSPACE/package" "$GITHUB_WORKSPACE"/wheel/*.whl
          echo "PYTHONPATH=$GITHUB_WORKSPACE/package${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          PYTHONPATH="$GITHUB_WORKSPACE/package${PYTHONPATH:+:$PYTHONPATH}" uv run python -c "from topology_rules.core import engine; print(engine.describe(engine.find_package()))"

      # All the tests, the slow ones too (`-m ""` replaces the default of
      # pyproject.toml). `-ra` lists why each test failed or was skipped, the
      # slowest tests are shown, and a test stuck for ten minutes dumps the
      # stacks of all the threads. With the package installed, its tests fail
      # rather than skip where the plugin cannot use it
      - name: Pytest
        env:
          TOPOLOGY_CHECKER_PACKAGE: ${{ matrix.package && '1' || '' }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/bin/topology-checker"
          TOPOLOGY_CHECKER="$GITHUB_WORKSPACE/bin/topology-checker" uv run pytest -m "" -ra --durations=30 -o faulthandler_timeout=600

  # The plugin on Windows, with QGIS from conda-forge (the long term release,
  # Qt5) and the CLI built here. The paths, the subprocess flags and the
  # executable lookup of the plugin are only really tested here
  test-windows:
    name: Pytest (Windows, QGIS ${{ matrix.qgis }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qgis: '3.44'
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash -el {0}
        working-directory: qgis_plugin
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10

      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10

      - name: Build the CLI
        timeout-minutes: 30
        working-directory: .
        run: cargo build --release --locked -p topology-checker

      - uses: conda-incubator/setup-miniconda@v3
        with:
          # 26.9.4-0 fails `conda init --all` on Windows
          miniforge-version: 26.7.2-1
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          activate-environment: qgis
        timeout-minutes: 15

      - name: Install QGIS
        timeout-minutes: 30
        run: conda install -y "qgis=${{ matrix.qgis }}" pyyaml

      # On Windows the Python package of QGIS, and its plugins such as
      # Processing, are not in site-packages. Where they are is found in the
      # environment, and printed, and written to a file for the steps that
      # run Python.
      #
      # It is a file, and not the variables of the job, because every step
      # starts a login shell (`bash -el`) that runs the activation scripts of
      # the environment again. The one of QGIS, qgis-activate.sh, puts its
      # folders in PYTHONPATH with ':', which Python on Windows does not split
      # on, and so it undoes what a step before has set. The steps source the
      # file at their start, and set the variables again with ';'.
      - name: Find QGIS
        timeout-minutes: 10
        run: |
          root=$(cygpath -u "${CONDA_PREFIX:-$CONDA/envs/qgis}")
          conda list qgis
          python -c "import sys; print(sys.executable); print(sys.path)"

          echo "Activation scripts of QGIS:"
          for script in "$root"/etc/conda/activate.d/*qgis*; do
            if [ -f "$script" ]; then
              echo "--- $script"
              cat "$script"
            fi
          done

          # The folder with the package, which has its compiled module
          package=''
          first=''
          while read -r hit; do
            echo "qgis package: $hit"
            first=${first:-$(dirname "$(dirname "$hit")")}
            if ls "$(dirname "$hit")"/_core* > /dev/null 2>&1; then
              package=$(dirname "$(dirname "$hit")")
            fi
          done < <(find "$root" -type f -path '*/qgis/__init__.py')
          if [ -z "$package" ] && [ -n "$first" ]; then
            echo "No package has the compiled module of QGIS next to it, taking the first"
            package=$first
          fi

          # The folder with the plugins, one of which is Processing
          plugins=''
          while read -r hit; do
            echo "processing plugin: $hit"
            plugins=$(dirname "$(dirname "$hit")")
          done < <(find "$root" -type f -path '*/plugins/processing/__init__.py')

          # The prefix of QGIS is where share/qgis, with its resources, is
          prefix="$root/Library"
          while read -r hit; do
            echo "qgis data: $hit"
            prefix=$(dirname "$(dirname "$hit")")
          done < <(find "$root" -type d -path '*/share/qgis')

          if [ -z "$package" ] || [ -z "$plugins" ]; then
            echo "::error::The Python package of QGIS or its plugins are not in the environment"
            find "$root" -maxdepth 4 -iname '*qgis*' | head -40
            exit 1
          fi

          # What qgis-activate.bat sets, with the paths that were found
          {
            printf "export PYTHONPATH='%s;%s'\n" "$(cygpath -w "$package")" "$(cygpath -w "$plugins")"
            printf "export QGIS_PREFIX_PATH='%s'\n" "$(cygpath -m "$prefix")"
            printf "export QT_PLUGIN_PATH='%s;%s'\n" "$(cygpath -w "$root/Library/plugins")" "$(cygpath -w "$root/Library/qtplugins")"
          } > "$(cygpath -u "$RUNNER_TEMP")/qgis-env.sh"
          cat "$(cygpath -u "$RUNNER_TEMP")/qgis-env.sh"
          for folder in Library/bin Library/mingw-w64/bin Library/usr/bin Scripts; do
            if [ -d "$root/$folder" ]; then
              cygpath -w "$root/$folder" >> "$GITHUB_PATH"
            fi
          done

      - name: Install the test dependencies
        timeout-minutes: 10
        run: python -m pip install pytest==9.1.1 pytest-qgis==5.0.1

      - name: Check the QGIS version
        timeout-minutes: 10
        run: |
          source "$(cygpath -u "$RUNNER_TEMP")/qgis-env.sh"
          python -c "import sys; print(sys.path)"
          python -c "from qgis.core import Qgis; print(Qgis.version())"
          python -c "import sys; from qgis.core import Qgis; sys.exit(not Qgis.version().startswith('${{ matrix.qgis }}.'))"

      # All the tests, the slow ones too, as in the images. The font of the
      # tests, Segoe UI, is added to Qt by the tests themselves
      - name: Pytest
        env:
          TOPOLOGY_CHECKER: ${{ github.workspace }}/target/release/topology-checker.exe
        run: |
          source "$(cygpath -u "$RUNNER_TEMP")/qgis-env.sh"
          python -m pytest -m "" -ra --durations=30 -o faulthandler_timeout=600

  pyqt6:
    name: PyQt6 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: registry.gitlab.com/oslandia/qgis/pyqgis-4-checker/pyqgis-qt-checker:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check PyQt5 to PyQt6 compatibility
        run: |
          pyqt5_to_pyqt6.py --dry_run topology_rules
          pyqt5_to_pyqt6.py topology_rules
