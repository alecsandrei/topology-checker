name: Python packages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --locked --group release
      - run: uv run --locked --group release pytest
      - run: uv run --locked --group release ruff check python tests scripts/*.py
      - run: uv run --locked --group release ruff format --check python tests scripts/*.py
      - run: uv run --locked --group release pyright
      - run: cargo fmt -p topology-checker-python --check
      - run: cargo clippy -p topology-checker-core -p topology-checker-python --all-targets --locked -- -D warnings
      - run: cargo test -p topology-checker-core -p topology-checker-python --locked
      - name: Install pinned license scanner
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Verify third-party notices
        run: uv run --locked --group release python scripts/update_notices.py --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p topology-checker-core -p topology-checker-python --all-targets --locked

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-15-intel
            target: x86_64
          - os: macos-15
            target: aarch64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    env:
      TOPOLOGY_EXPECT_WHEEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: '2014'
      - name: Test installed ABI3 wheel on oldest and recent CPython
        shell: bash
        run: |
          for version in 3.10 3.14; do
            uv venv --python "$version" .wheel-test
            uv pip install --python .wheel-test dist/*.whl pytest geopandas
            uv run --no-project --python .wheel-test python scripts/check_install.py
            uv run --no-project --python .wheel-test python -m pytest tests
            rm -rf .wheel-test
          done
      - name: Test minimum dependencies on CPython 3.10
        shell: bash
        run: |
          uv venv --python 3.10 .minimum-test
          uv pip install --python .minimum-test dist/*.whl pytest 'numpy<2' 'pandas<3' 'shapely==2.0.0' 'pyproj==3.4.0' 'geopandas==0.14.0'
          uv run --no-project --python .minimum-test python scripts/check_install.py
          uv run --no-project --python .minimum-test python -m pytest tests
      - name: Test base install without GeoPandas
        shell: bash
        run: |
          uv venv --python 3.10 .base-test
          uv pip install --python .base-test dist/*.whl pytest
          uv run --no-project --python .base-test python scripts/check_install.py --without-geopandas
          uv run --no-project --python .base-test python -m pytest tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    env:
      TOPOLOGY_EXPECT_WHEEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - run: uv build --sdist
      - name: Build wheel from isolated source distribution
        run: uv build dist/*.tar.gz --wheel --out-dir dist/from-sdist
      - run: uv venv --python 3.10 .sdist-test
      - run: uv pip install --python .sdist-test dist/from-sdist/*.whl pytest geopandas
      - run: uv run --no-project --python .sdist-test python scripts/check_install.py
      - run: uv run --no-project --python .sdist-test python -m pytest tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release-bundle:
    needs: [checks, msrv, wheels, sdist]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - run: uv sync --locked --only-group release --no-install-project
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          merge-multiple: true
          path: release-bundle
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: release-bundle
      - name: Validate complete release and version tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            uv run --no-sync python scripts/validate_release.py release-bundle --tag "$RELEASE_TAG"
          else
            uv run --no-sync python scripts/validate_release.py release-bundle
          fi
      - name: Strict PyPI metadata and README validation
        run: uv run --no-sync twine check --strict release-bundle/*.whl release-bundle/*.tar.gz
      - name: Verify final checksums
        run: uv run --no-sync python scripts/validate_release.py release-bundle --verify-checksums
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-bundle
          path: release-bundle/*
          if-no-files-found: error

  publish:
    needs: release-bundle
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-release-bundle
          path: dist
      # twine only accepts distributions.
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
