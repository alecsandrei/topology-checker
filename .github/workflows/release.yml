name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.1.0
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
defaults:
  run:
    shell: bash
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          # Linux builds on 22.04 so the binaries run on glibc 2.35 and newer.
          - { platform: linux-x64, os: ubuntu-22.04 }
          - { platform: linux-arm64, os: ubuntu-22.04-arm }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: macos-x64, os: macos-15-intel }
          - { platform: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Release config comes from the workflow's commit, so tags made before it can be released too.
      - name: Release config
        run: |
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- about.toml web/vite.config.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p topology-checker -p topology-checker-web
      - name: Smoke test
        run: ./target/release/topology-checker rules > /dev/null
      - name: Package
        run: |
          dir="topology-checker-$TAG-${{ matrix.platform }}"
          if [[ "$RUNNER_OS" == Windows ]]; then exe=.exe; else exe=; fi
          mkdir "$dir"
          cp "target/release/topology-checker$exe" "target/release/topology-checker-web$exe" "$dir/"
          cp README.md LICENSE crates/server/examples/DATA-LICENSE.md "$dir/"
          cp web/dist/.vite/license.md "$dir/THIRD-PARTY-NOTICES-web.md"
      - uses: actions/upload-artifact@v4
        with:
          name: topology-checker-${{ env.TAG }}-${{ matrix.platform }}
          path: topology-checker-${{ env.TAG }}-${{ matrix.platform }}/
          if-no-files-found: error

  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Release config
        run: |
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- about.toml web/vite.config.ts
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "topology-checker") | .version')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match crate version $version."
            exit 1
          fi
      - name: Install pinned license scanner
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Third-party notices
        run: |
          {
            echo "Third-party notices for the topology-checker CLI and web app binaries."
            echo "Generated by cargo-about 0.9.2 from Cargo.lock and about.toml."
            echo "The project's own MIT license is in LICENSE. The web app's bundled"
            echo "JavaScript packages are listed in THIRD-PARTY-NOTICES-web.md."
            echo
            cargo about generate --workspace --config about.toml --locked --fail --format json \
              --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu \
              --target x86_64-apple-darwin --target aarch64-apple-darwin \
              --target x86_64-pc-windows-msvc | jq -r '
              .licenses | sort_by(.id, .text)[]
              | ([.used_by[].crate | select(.name | startswith("topology-checker") | not) | "\(.name) \(.version)"] | sort) as $crates
              | select($crates | length > 0)
              | "License: \(.id)\nUsed by: \($crates | join(", "))\n\n\(.text | gsub("\r\n"; "\n") | rtrimstr("\n"))\n"'
          } > THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  rustgis-plugin:
    needs: [notices]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: notices
      - name: Build and package the plugin
        run: python3 scripts/package_rustgis_plugin.py --out rustgis-plugin --notices notices/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rustgis-plugin
          path: rustgis-plugin/*.rgplugin
          if-no-files-found: error

  release:
    needs: [build, notices, rustgis-plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip
        working-directory: dist
        run: |
          for dir in topology-checker-*; do
            cp notices/THIRD-PARTY-NOTICES.txt "$dir/"
            # Artifacts do not keep the executable bit.
            if [[ "$dir" != *windows* ]]; then
              chmod +x "$dir/topology-checker" "$dir/topology-checker-web"
            fi
            zip -qr "$dir.zip" "$dir"
          done
          # The RustGIS plugin installs as it is: Plugin Manager > Install from File.
          cp rustgis-plugin/*.rgplugin .
          sha256sum -- *.zip *.rgplugin > SHA256SUMS
      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Unzip the archive for your platform and run `topology-checker` (CLI) or `topology-checker-web` (web app). `SHA256SUMS` lists the checksums.

            Also available with `uv add topology-checker` (PyPI) and `cargo install topology-checker` (crates.io). Documentation: https://alecsandrei.github.io/topology-checker/

            RustGIS: install `topology-checker-*.rgplugin` with Plugin Manager > Install from File.

            QGIS: install the `topology_rules` zip with Plugins > Manage and Install Plugins > Install from ZIP. The plugin needs the CLI.

            macOS: the binaries are unsigned. If macOS blocks them, run `xattr -dr com.apple.quarantine .` in the unzipped folder.
        run: |
          gh release create "$TAG" ./*.zip ./*.rgplugin SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "topology-checker ${TAG#v}" --notes "$NOTES"

  qgis-plugin:
    # Builds the plugin zip from the tag, attaches it to the release and
    # uploads it to plugins.qgis.org. Without the token it is skipped.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
    steps:
      - name: No token
        if: env.QGIS_PLUGIN_TOKEN == ''
        run: echo "::notice::QGIS_PLUGIN_TOKEN is not set, so the plugin is not published to plugins.qgis.org."
      - uses: actions/checkout@v4
        if: env.QGIS_PLUGIN_TOKEN != ''
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
        if: env.QGIS_PLUGIN_TOKEN != ''
      # Run from the root of the repository: the settings are in .qgis-plugin-ci
      - name: Release the plugin
        if: env.QGIS_PLUGIN_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uvx qgis-plugin-ci@2.10.0 release "${TAG#v}" --release-tag "$TAG" --qgis-token "$QGIS_PLUGIN_TOKEN" --github-token "$GITHUB_TOKEN"

  crates:
    # Publishes to crates.io with the CARGO_REGISTRY_TOKEN secret, once the builds have
    # passed. A version that is there already is skipped, so a run can be
    # repeated. A manual run needs the tag of a release.
    needs: [build, notices, rustgis-plugin]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # A tag without the token must not pass for a release of the crates
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::The secret CARGO_REGISTRY_TOKEN is not set, so the crates are not published."
            exit 1
          fi
          version="${TAG#v}"
          # In the order of their dependencies; cargo waits for the index
          for crate in topology-checker-core topology-checker-io topology-checker; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'topology-checker-release (https://github.com/alecsandrei/topology-checker)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [[ "$status" == 200 ]]; then
              echo "$crate $version is on crates.io already."
              continue
            fi
            if [[ "$status" != 404 ]]; then
              echo "crates.io answered $status for $crate $version."
              exit 1
            fi
            cargo publish -p "$crate" --locked
          done
