# Versioned docs on the gh-pages branch: /dev/ follows master, /X.Y.Z/ is built from the
# python-vX.Y.Z tag, /stable/ is the newest release and / redirects to it. The version selector
# reads /versions.json. The Rust API from master is at /api/rust/dev/, and released Rust API
# docs are on docs.rs.
name: docs
on:
  push:
    branches: [master]
    tags: ['python-v*']
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'crates/core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'crates/core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish docs for, such as python-v0.1.0
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  DEV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
      # python-v0.1.0 predates Zensical and the version selector.
      - name: Build
        run: |
          if [[ -f zensical.toml ]]; then
            uv run --locked --only-group docs zensical build
          else
            printf 'extra:\n  version:\n    provider: mike\n    alias: true\n' >> mkdocs.yml
            uv run --locked --only-group docs mkdocs build --strict
          fi
      - if: env.TAG || env.DEV == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          if-no-files-found: error
  rust-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p topology-checker-core --no-deps --locked
          echo '<meta http-equiv=refresh content=0;url=topology_checker_core/index.html>' > target/doc/index.html
      - if: env.DEV == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-api
          path: target/doc
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request'
    needs: [site, rust-api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Only the newest final release becomes stable. versions.json lists dev and every
      # python-v* tag, newest first.
      - name: Version
        id: version
        run: |
          [[ -z "$TAG" || "$TAG" =~ ^python-v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "Not a python-v tag: $TAG"; exit 1; }
          versions=$(git ls-remote --tags --refs origin 'python-v*' | sed 's|.*refs/tags/python-v||' | sort -rV)
          newest=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$versions" | head -n 1)
          version=${TAG#python-v}
          echo "version=${version:-dev}" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" && "$version" == "$newest" ]]; then echo stable=true; else echo stable=false; fi >> "$GITHUB_OUTPUT"
          mkdir root
          touch root/.nojekyll
          jq -n --arg stable "$newest" '[{version: "dev", title: "dev", aliases: []}]
            + [$ARGS.positional[] | {version: ., title: ., aliases: (if . == $stable then ["stable"] else [] end)}]' \
            --args $versions > root/versions.json
          redirect() { mkdir -p "root/$1" && echo "<meta http-equiv=refresh content=0;url=$2>" > "root/$1/index.html"; }
          redirect . stable/
          # Pages that were at the root before the docs were versioned.
          for page in install cli rules web-app python-usage python-api; do redirect "$page" "../stable/$page/"; done
          redirect rust/topology_checker_core https://docs.rs/topology-checker-core/latest/topology_checker_core/
      - name: Site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/site
          target-folder: ${{ steps.version.outputs.version }}
          single-commit: true
      - name: Stable
        if: steps.version.outputs.stable == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/site
          target-folder: stable
          single-commit: true
      - name: Rust API (dev)
        if: env.DEV == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/rust-api
          target-folder: api/rust/dev
          single-commit: true
      # The redirects and versions.json sit next to the version folders.
      - name: Root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: root
          clean: false
          single-commit: true
