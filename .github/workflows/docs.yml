# Polars layout on the gh-pages branch: the user guide at / follows the latest release, the
# Python API is versioned under /api/python/ (dev, 0.1, stable), the Rust API from master is
# at /api/rust/dev/, and released Rust API docs are on docs.rs.
name: docs
on:
  push:
    branches: [master]
    tags: ['python-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish docs for, such as python-v0.1.0
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv run --locked --only-group docs mkdocs build --strict
      - name: Redirect moved pages
        if: env.TAG
        run: |
          redirect() { mkdir -p "site/$1" && echo "<meta http-equiv=refresh content=0;url=$2>" > "site/$1/index.html"; }
          [[ -e site/python-api/index.html ]] || redirect python-api ../api/python/stable/
          redirect rust/topology_checker_core https://docs.rs/topology-checker-core/latest/topology_checker_core/
          touch site/.nojekyll
      - if: env.TAG
        uses: actions/upload-artifact@v4
        with:
          name: guide
          path: site
          include-hidden-files: true
          if-no-files-found: error
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # API docs config comes from the workflow's commit, so tags made before it can be published too.
      - name: Python sources from the tag
        if: env.TAG
        run: |
          git fetch --depth 1 origin "refs/tags/$TAG"
          rm -rf python/topology_checker
          git checkout FETCH_HEAD -- python/topology_checker
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv run --locked --only-group docs mkdocs build --strict -f python-api/mkdocs.yml
  rust-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p topology-checker-core --no-deps --locked
          echo '<meta http-equiv=refresh content=0;url=topology_checker_core/index.html>' > target/doc/index.html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: rust-api
          path: target/doc
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request'
    needs: [guide, python-api, rust-api]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      DEV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Python API (dev)
        if: env.DEV == 'true'
        run: |
          git fetch --depth 1 origin gh-pages:gh-pages || true
          uv run --locked --only-group docs mike deploy --push -F python-api/mkdocs.yml dev
      - if: env.DEV == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rust-api
          path: rust-api
      - name: Rust API (dev)
        if: env.DEV == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: rust-api
          target-folder: api/rust/dev
          single-commit: true
      # python-v0.Y.Z publishes as 0.Y and python-vX.Y.Z as X. Only the newest final
      # release becomes stable and replaces the user guide.
      - name: Release version
        id: release
        if: env.TAG
        run: |
          [[ "$TAG" =~ ^python-v([0-9]+)\.([0-9]+)\.[0-9]+ ]] || { echo "Not a python-v tag: $TAG"; exit 1; }
          if [[ "${BASH_REMATCH[1]}" == 0 ]]; then version="0.${BASH_REMATCH[2]}"; else version="${BASH_REMATCH[1]}"; fi
          newest=$(git ls-remote --tags --refs origin 'python-v*' | sed 's|.*refs/tags/||' \
            | grep -E '^python-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == "$newest" ]]; then echo stable=true; else echo stable=false; fi >> "$GITHUB_OUTPUT"
      - name: Python sources from the tag
        if: env.TAG
        run: |
          git fetch --depth 1 origin "refs/tags/$TAG"
          rm -rf python/topology_checker
          git checkout FETCH_HEAD -- python/topology_checker
      - name: Python API (release)
        if: env.TAG
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STABLE: ${{ steps.release.outputs.stable }}
        run: |
          git fetch --depth 1 origin gh-pages:gh-pages || true
          mike() { uv run --locked --only-group docs mike "$@" --push -F python-api/mkdocs.yml; }
          if [[ "$STABLE" == true ]]; then
            mike deploy --update-aliases "$VERSION" stable
            mike set-default stable
          else
            mike deploy "$VERSION"
          fi
      - if: steps.release.outputs.stable == 'true'
        uses: actions/download-artifact@v4
        with:
          name: guide
          path: guide
      - name: User guide
        if: steps.release.outputs.stable == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: guide
          clean-exclude: api/
          single-commit: true
