# Order selects MIT when a dependency offers alternative licenses.
accepted = ["MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-DFS-2016", "Unicode-3.0", "BSL-1.0", "Zlib"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# cfg_block declares only a license-file: an Apache-2.0 notice.
[cfg_block.clarify]
license = "Apache-2.0"

[[cfg_block.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "408bbc4d10bdf74d8c9b74b64ea4910603257e24133da18edc4d16198e3b4010"
