# Preview: uv run --only-group docs mkdocs serve
site_name: topology-checker
site_url: https://alecsandrei.github.io/topology-checker/
repo_url: https://github.com/alecsandrei/topology-checker
edit_uri: edit/master/docs/
theme:
  name: material
  features:
    - content.code.copy
nav:
  - Home: README.md
  - Install: install.md
  - CLI: cli.md
  - Rules: rules.md
  - Web app: web-app.md
  - Python:
      - Usage: python-usage.md
      - API reference: python-api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: false
            heading_level: 2
            show_source: false
            show_if_no_docstring: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
