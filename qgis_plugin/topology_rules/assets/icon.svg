<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Topology Rules</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e8a73"/>
      <stop offset="1" stop-color="#263e36"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
  <!-- top face -->
  <path d="M32 15 L47.16 23.75 L32 32.5 L16.84 23.75Z" fill="#f6f7f4" fill-opacity=".22"/>
  <!-- edges -->
  <path d="M32 15 L47.16 23.75 L47.16 41.25 L32 50 L16.84 41.25 L16.84 23.75Z M16.84 23.75 L32 32.5 L47.16 23.75 M32 32.5 L32 50"
        fill="none" stroke="#f6f7f4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- vertices -->
  <g fill="#263e36" stroke="#f6f7f4" stroke-width="2.6">
    <circle cx="32" cy="15" r="3.5"/>
    <circle cx="47.16" cy="23.75" r="3.5"/>
    <circle cx="32" cy="50" r="3.5"/>
    <circle cx="16.84" cy="41.25" r="3.5"/>
    <circle cx="16.84" cy="23.75" r="3.5"/>
    <circle cx="32" cy="32.5" r="3.5"/>
  </g>
  <!-- flagged vertex -->
  <circle cx="47.16" cy="41.25" r="8.1" fill="#263e36" stroke="#f6f7f4" stroke-width="1.6"/>
  <circle cx="47.16" cy="41.25" r="5.9" fill="#e0352b"/>
</svg>
